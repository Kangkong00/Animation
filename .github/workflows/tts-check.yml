name: TTS 연결 확인

on:
  workflow_dispatch:
  push:
    branches: [claude/gods-private-life-builder-tvfid9]
    paths: ['.github/workflows/tts-check.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ffmpeg 확인
        run: |
          which ffmpeg || sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: edge-tts 설치
        run: pip install -q edge-tts

      - name: 한국어 음성 생성 (진짜 목소리)
        run: |
          python3 - <<'PY'
          import asyncio, edge_tts
          LINE = "아무것도 없었습니다. 진짜로, 아무것도요. 하늘도, 땅도, 시간마저도."
          for label, voice in [("male","ko-KR-InJoonNeural"), ("female","ko-KR-SunHiNeural")]:
              asyncio.run(edge_tts.Communicate(LINE, voice, rate="-5%").save(f"{label}_{voice}.mp3"))
              print("생성 완료:", label, voice)
          PY

      - name: 길이 측정
        run: |
          for f in *.mp3; do
            echo "$f -> $(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f") 초"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: voice-samples
          path: '*.mp3'
