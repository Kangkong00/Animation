name: 영상 만들기

# 실행마다 다른 이름이 붙어야 목록에서 구분된다
run-name: >-
  ${{ inputs.check_only && '점검' || '조립' }} · ${{ inputs.mode }}${{
  inputs.shorts != '' && format(' · 쇼츠 {0}', inputs.shorts) || '' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '재료'
        type: choice
        default: 실제
        options: [실제, 데모]
      shorts:
        description: '쇼츠 컷 · 예 3-8 · 안 만들면 비워 두기'
        type: string
        default: ''
      check_only:
        description: '점검만 하고 끝내기 · 40초'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: 어느 폴더로 만들지 정하기
        id: src
        run: |
          if [[ "${{ inputs.mode }}" == "데모" ]]; then
            echo "images=samples/images"   >> "$GITHUB_OUTPUT"
            echo "script=samples/script.json" >> "$GITHUB_OUTPUT"
            echo "::notice::데모 모드 — samples 폴더로 만듭니다"
          else
            echo "images=input/images"     >> "$GITHUB_OUTPUT"
            echo "script=input/script.json" >> "$GITHUB_OUTPUT"
          fi

      - name: ffmpeg · 한글 폰트 준비
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          ffmpeg -version | head -1
          echo "코어 수: $(nproc)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 파이썬 패키지 설치
        run: pip install -q -r requirements.txt

      - name: 입력 점검
        run: python3 build.py --check --images "${{ steps.src.outputs.images }}" --script "${{ steps.src.outputs.script }}"

      - name: 조립
        if: ${{ !inputs.check_only }}
        run: python3 build.py --images "${{ steps.src.outputs.images }}" --script "${{ steps.src.outputs.script }}"

      - name: 완성본 이름 붙이기
        if: ${{ !inputs.check_only }}
        id: name
        run: |
          TITLE=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1],encoding='utf-8')).get('title','완성본'))" "${{ steps.src.outputs.script }}")
          SAFE=$(echo "$TITLE" | tr '/\\:*?"<>|' '_')
          mkdir -p deliver
          cp output/final.mp4 "deliver/${SAFE}.mp4"
          echo "title=$SAFE" >> "$GITHUB_OUTPUT"
          ls -lh deliver/

      - name: 완성본 올리기
        if: ${{ !inputs.check_only }}
        uses: actions/upload-artifact@v4
        with:
          name: 완성본
          path: deliver/*.mp4
          retention-days: 30

      - name: 컷별 클립·음성 올리기
        if: ${{ !inputs.check_only }}
        uses: actions/upload-artifact@v4
        with:
          name: 컷별-클립과-음성
          path: |
            output/clips/
            output/audio/
          retention-days: 30

      - name: 쇼츠 뽑기
        if: ${{ !inputs.check_only && inputs.shorts != '' }}
        run: |
          python3 build.py --shorts "${{ inputs.shorts }}" \
            --images "${{ steps.src.outputs.images }}" \
            --script "${{ steps.src.outputs.script }}"
          cp output/shorts.mp4 "deliver/${{ steps.name.outputs.title }} 쇼츠.mp4"

      - name: 쇼츠 올리기
        if: ${{ !inputs.check_only && inputs.shorts != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: 쇼츠
          path: deliver/*쇼츠.mp4
          retention-days: 30

      - name: 완성본을 받기 쉬운 곳에 올리기
        if: ${{ !inputs.check_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Actions 실행 목록을 뒤지지 않아도 되도록, 완성본만 따로 모아 둔다.
          # releases/latest 는 주소가 바뀌지 않아서 즐겨찾기 해 두면 된다.
          TAG="v${{ github.run_number }}"
          NOTE=$(cat <<EOF
          ## ${{ steps.name.outputs.title }}

          | | |
          |---|---|
          | 길이 | $(ffprobe -v error -show_entries format=duration -of csv=p=0 output/final.mp4 | cut -d. -f1) 초 |
          | 컷 | $(ls output/clips/*.mp4 | wc -l) 개 |
          | 만든 때 | $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') |

          아래 **Assets** 에서 mp4 를 바로 누르면 받아집니다. 압축 안 되어 있습니다.
          EOF
          )
          gh release create "$TAG" deliver/*.mp4 \
            --title "${{ steps.name.outputs.title }}" \
            --notes "$NOTE" --latest

      - name: 어떤 폰트로 자막을 그렸는지 확인
        if: ${{ !inputs.check_only }}
        run: |
          python3 -c "
          from builder import config, fonts, subtitle
          cfg = config.load('config.json')
          font, note = fonts.resolve(cfg.subtitle['font'])
          print('자막 폰트 :', font)
          print('대체 알림 :', note or '없음 (설정한 폰트 그대로)')
          print('크기 보정 : ASS 1 =', round(subtitle.px_per_unit(font) or 0, 3), 'px')
          "
          echo "--- 빌드 요약 ---"
          cat output/summary.json
          if [ -f output/shorts_summary.json ]; then
            echo "--- 쇼츠 요약 ---"
            cat output/shorts_summary.json
          fi

      - name: 요약
        if: ${{ !inputs.check_only }}
        run: |
          {
            echo "## ${{ steps.name.outputs.title }}"
            echo ""
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| 총 길이 | $(ffprobe -v error -show_entries format=duration -of csv=p=0 output/final.mp4) 초 |"
            echo "| 컷 수 | $(ls output/clips/*.mp4 | wc -l) 개 |"
            echo "| 파일 크기 | $(du -h output/final.mp4 | cut -f1) |"
            echo "| 자막 폰트 | $(python3 -c "from builder import config, fonts; print(fonts.resolve(config.load('config.json').subtitle['font'])[0])") |"
            echo ""
            echo "위쪽 **Artifacts** 에서 \`완성본\` 을 내려받으세요."
          } >> "$GITHUB_STEP_SUMMARY"
